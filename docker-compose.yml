services:
    app:
        build:
            args:
                user: ${USER_NAME:-appuser}
                uid: ${USER_ID:-1000}
            context: ./
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - authmobilebackend
    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-auth_mobile_backend}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - mysql:/var/lib/mysql
        networks:
            - authmobilebackend
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping --host=localhost --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
    nginx:
        image: nginx:1.28-alpine
        restart: unless-stopped
        ports:
            - "${FORWARD_APP_PORT:-80}:80"
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - authmobilebackend
    mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
            - "${FORWARD_MAILHOG_PORT:-1025}:1025"
            - "${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025"
        networks:
            - authmobilebackend

volumes:
    mysql:

networks:
    authmobilebackend:
        driver: bridge
